<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#10110f" />
  <title>惯性谱 · 手机乐器</title>
  <style>
    :root{color-scheme:dark;--ink:#10110f;--paper:#f1efe7;--acid:#d7ff45;--line:rgba(241,239,231,.17)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:-apple-system,"PingFang SC",sans-serif}body{min-height:100svh;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 82% 8%,rgba(215,255,69,.13),transparent 28%),var(--ink)}
    header{display:flex;height:34px;align-items:center;justify-content:space-between;color:rgba(241,239,231,.58);font-size:11px}header a{color:inherit;text-decoration:none}.dot{width:8px;height:8px;border-radius:50%;background:#65675f}.dot.connected{background:var(--acid);box-shadow:0 0 12px var(--acid)}main{width:min(100%,480px);margin:auto}
    .top{display:grid;margin:8px 0 12px;grid-template-columns:86px 1fr;gap:12px;align-items:stretch}.motion{display:grid;min-height:86px;place-items:center;border:1px solid var(--line);border-radius:20px;background:rgba(241,239,231,.035);text-align:center}.motion.active{border-color:var(--acid);box-shadow:inset 0 0 25px rgba(215,255,69,.07)}.motion strong{display:block;font:32px/1 ui-monospace,monospace}.motion small{font:8px ui-monospace,monospace;opacity:.44}.pair{display:grid;gap:7px}input{width:100%;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;outline:0;background:rgba(241,239,231,.05);color:var(--paper);font:17px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}button{border:0;color:inherit;font:650 13px -apple-system,"PingFang SC",sans-serif}.pair-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.connect{border-radius:11px;background:var(--acid);color:var(--ink)}.sensor{min-height:40px;border:1px solid var(--line);border-radius:11px;background:transparent}button:disabled{opacity:.56}
    #message{min-height:18px;margin:0 2px 9px;color:rgba(241,239,231,.48);font-size:10px;line-height:1.5}.mode-row{display:flex;margin-bottom:9px;gap:7px;align-items:center}.mode-row span{margin-right:auto;color:rgba(241,239,231,.5);font-size:10px}.mode{min-height:32px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent}.mode.active{border-color:var(--acid);background:rgba(215,255,69,.1);color:var(--acid)}.stop{min-height:32px;padding:0 11px;border-radius:999px;background:rgba(255,110,69,.14);color:#ff9d80}
    .keyboard{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.note{position:relative;display:flex;min-height:86px;flex-direction:column;justify-content:space-between;padding:11px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(150deg,rgba(241,239,231,.085),rgba(241,239,231,.025));text-align:left;touch-action:none;-webkit-user-select:none;user-select:none;transition:80ms ease}.note b{font:500 24px ui-monospace,monospace}.note small{font-size:8px;letter-spacing:.08em;opacity:.42}.note.active{transform:scale(.965);border-color:hsl(var(--hue) 90% 65%);background:hsla(var(--hue),90%,60%,.19);box-shadow:inset 0 0 28px hsla(var(--hue),90%,60%,.12)}
    .percussion-panel{display:none;min-height:330px;padding:24px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 50% 40%,rgba(215,255,69,.13),transparent 48%),rgba(241,239,231,.025);place-items:center;text-align:center}.percussion-panel strong{display:block;font-size:27px}.percussion-panel p{max-width:260px;color:rgba(241,239,231,.5);font-size:11px;line-height:1.7}.percussion-rings{position:relative;width:145px;height:145px}.percussion-rings i{position:absolute;inset:0;border:1px solid rgba(215,255,69,.28);border-radius:50%}.percussion-rings i:last-child{inset:24px}.percussion-mode .keyboard,.percussion-mode .mode-row{display:none}.percussion-mode .percussion-panel{display:grid}
    .string-board{position:relative;display:none;min-height:330px;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(90deg,rgba(215,255,69,.04),transparent 35%),rgba(241,239,231,.025);touch-action:none;-webkit-user-select:none;user-select:none}.string-mode .keyboard,.string-mode .mode-row,.string-mode .percussion-panel{display:none}.string-mode .string-board{display:grid;grid-template-rows:repeat(4,1fr)}.string-lane{position:relative;display:flex;padding:0 16px;align-items:center;border-bottom:1px solid rgba(241,239,231,.08)}.string-lane:last-of-type{border-bottom:0}.string-lane span{width:28px;color:rgba(241,239,231,.55);font:13px ui-monospace,monospace}.string-lane>i{height:var(--weight);flex:1;border-radius:999px;background:linear-gradient(90deg,rgba(241,239,231,.35),var(--acid),rgba(241,239,231,.45));box-shadow:0 0 8px rgba(215,255,69,.1)}.string-lane small{width:34px;color:rgba(241,239,231,.3);font:8px ui-monospace,monospace;text-align:right}.pitch-mark{position:absolute;z-index:1;top:50%;left:calc(44px + (100% - 94px) * var(--p));width:4px;height:4px;transform:translate(-50%,-50%);border:1px solid rgba(241,239,231,.35);border-radius:50%;background:var(--ink);pointer-events:none}.pitch-mark.scale{width:8px;height:8px;border-color:rgba(215,255,69,.78);background:rgba(215,255,69,.28);box-shadow:0 0 8px rgba(215,255,69,.28)}.pitch-mark label{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:rgba(215,255,69,.62);font:7px ui-monospace,monospace}.string-cursor{position:absolute;z-index:2;top:var(--y,12.5%);left:var(--x,45%);display:grid;width:44px;height:44px;transform:translate(-50%,-50%);place-items:center;border:1px solid var(--acid);border-radius:50%;background:rgba(16,17,15,.82);box-shadow:0 0 24px rgba(215,255,69,.25);opacity:0;pointer-events:none;transition:opacity 80ms}.string-cursor.active{opacity:1}.string-cursor b{font:9px ui-monospace,monospace}.string-guide{position:absolute;z-index:3;top:8px;right:14px;color:rgba(241,239,231,.28);font-size:8px;letter-spacing:.08em;pointer-events:none}
    .legend{display:grid;margin-top:11px;padding:10px 4px 0;border-top:1px solid rgba(241,239,231,.1);grid-template-columns:repeat(4,1fr);gap:5px}.legend span{display:grid;gap:3px;color:rgba(241,239,231,.47);font-size:8px;text-align:center}.legend b{color:var(--paper);font-size:9px;font-weight:560}.percussion-legend,.string-legend{display:none;grid-template-columns:1fr}.percussion-mode .tonal-legend,.string-mode .tonal-legend{display:none}.percussion-mode .percussion-legend,.string-mode .string-legend{display:grid}.readout{display:flex;margin-top:9px;justify-content:space-between;color:rgba(241,239,231,.34);font:8px ui-monospace,monospace}.warning{display:none;padding:10px;border:1px solid #ff875d;border-radius:10px;color:#ffb49b;font-size:11px}
    @media(max-width:360px){.note{min-height:74px;padding:9px}.note b{font-size:20px}.top{grid-template-columns:74px 1fr}.motion{min-height:74px}}
  </style>
</head>
<body>
  <header><a href="/">← 返回</a><span>惯性谱 / PHONE INSTRUMENT</span><i id="status-dot" class="dot"></i></header>
  <main>
    <div id="script-warning" class="warning">控制脚本没有加载，请刷新页面。</div>
    <section class="top">
      <div id="motion" class="motion"><div><strong id="magnitude">0.0</strong><small>MOTION</small></div></div>
      <div class="pair"><input id="code" maxlength="5" placeholder="输入配对码" autocomplete="off"/><div class="pair-row"><button id="connect" class="connect">连接电脑</button><button id="sensor" class="sensor">启用动作</button></div></div>
    </section>
    <p id="message">先连接电脑；音高键不需要传感器权限</p>
    <section class="mode-row"><span>演奏模式</span><button class="mode active" data-mode="hold">按住</button><button class="mode" data-mode="latch">锁定</button><button id="stop" class="stop">全部停止</button></section>
    <section class="percussion-panel"><div><div class="percussion-rings"><i></i><i></i></div><strong id="motion-title">Kinetic Shaker</strong><p id="motion-copy">只要冲击强度持续轻微波动，沙锤就连续演奏；停止动作后迅速停下。</p></div></section>
    <section id="string-board" class="string-board" aria-label="四弦无品滑奏界面">
      <div class="string-guide">按住起弓 · 左右滑音 · 上下换弦</div>
      <div class="string-lane" style="--weight:1px"><span>G3</span><i></i><small>D4</small></div>
      <div class="string-lane" style="--weight:1.5px"><span>D4</span><i></i><small>A4</small></div>
      <div class="string-lane" style="--weight:2px"><span>A4</span><i></i><small>E5</small></div>
      <div class="string-lane" style="--weight:2.5px"><span>E5</span><i></i><small>B5</small></div>
      <div id="string-cursor" class="string-cursor"><b id="string-pitch">G3</b></div>
    </section>
    <section id="keyboard" class="keyboard">
      <button class="note" data-midi="60" data-name="C4" style="--hue:42"><small>LOW</small><b>C4</b></button>
      <button class="note" data-midi="62" data-name="D4" style="--hue:62"><small>02</small><b>D4</b></button>
      <button class="note" data-midi="64" data-name="E4" style="--hue:84"><small>03</small><b>E4</b></button>
      <button class="note" data-midi="65" data-name="F4" style="--hue:104"><small>04</small><b>F4</b></button>
      <button class="note" data-midi="67" data-name="G4" style="--hue:132"><small>05</small><b>G4</b></button>
      <button class="note" data-midi="69" data-name="A4" style="--hue:164"><small>06</small><b>A4</b></button>
      <button class="note" data-midi="71" data-name="B4" style="--hue:202"><small>07</small><b>B4</b></button>
      <button class="note" data-midi="72" data-name="C5" style="--hue:238"><small>HIGH</small><b>C5</b></button>
    </section>
    <section class="legend tonal-legend"><span><b>左右倾斜</b>声像</span><span><b>前后倾斜</b>明暗</span><span><b>连续摇动</b>颤音</span><span><b>快速上提</b>混响 + 延迟</span></section>
    <section class="legend percussion-legend"><span id="motion-legend"><b>轻微连续晃动</b>沙锤 · 动则响，停则止</span></section>
    <section class="legend string-legend"><span><b>无品滑奏</b>按住起弓 · 横向滑音 · 晃动揉弦（CC1）</span></section>
    <div class="readout"><span>X <em id="x">0.0</em></span><span>Y <em id="y">0.0</em></span><span>Z <em id="z">0.0</em></span><span>TILT <em id="tilt">0°</em></span></div>
  </main>
  <script>setTimeout(function(){if(!window.__MOTIONSCORE_READY__)document.getElementById('script-warning').style.display='block'},1800)</script>
  <script src="/local-peerjs.js"></script>
  <script>
  (function(){
    window.__MOTIONSCORE_READY__=true;
    var peer=null,connection=null,orientation={alpha:0,beta:0,gamma:0},lastSent=0,energy=0,mode="hold",instrument="tonal",activeStringPointer=null,lastStringMove=null;
    var code=document.getElementById("code"),connectButton=document.getElementById("connect"),sensorButton=document.getElementById("sensor"),message=document.getElementById("message"),dot=document.getElementById("status-dot"),motion=document.getElementById("motion"),magnitude=document.getElementById("magnitude");
    function msg(text){message.textContent=text}function send(data){if(connection&&connection.open){connection.send(data);return true}msg("请先连接电脑舞台端");return false}function peerId(v){return "motionscore-"+v.trim().toLowerCase()}function velocity(){return Math.min(1,Math.max(.32,.52+energy/18))}
    code.addEventListener("input",function(){code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,"")});
    function setInstrument(value){endString(false);instrument=value;document.body.classList.toggle("percussion-mode",value==="shaker"||value==="drum");document.body.classList.toggle("string-mode",value==="strings");clearNotes();if(value==="strings"){msg("惯性弦：按住起弓，左右滑音，上下换弦，晃动手机揉弦")}else if(value==="shaker"){document.getElementById("motion-title").textContent="Kinetic Shaker";document.getElementById("motion-copy").textContent="只要冲击强度持续轻微波动，沙锤就连续演奏；停止动作后迅速停下。";document.getElementById("motion-legend").innerHTML="<b>轻微连续晃动</b>沙锤 · 动则响，停则止";msg("沙锤模式：轻微波动持续，沙锤持续")}else if(value==="drum"){document.getElementById("motion-title").textContent="Impact Drum";document.getElementById("motion-copy").textContent="做一次明确的冲击或急停，力度越大鼓声越重。";document.getElementById("motion-legend").innerHTML="<b>明显冲击</b>重鼓 · 力度响应";msg("重鼓模式：明显冲击触发重鼓")}else msg("旋律模式：触键选择音高")}
    connectButton.addEventListener("click",function(){var room=code.value.trim();if(room.length<4){msg("请输入电脑舞台端显示的配对码");return}if(typeof Peer==="undefined"){msg("通信组件未加载，请刷新页面");return}connectButton.disabled=true;connectButton.textContent="连接中";if(peer)peer.destroy();peer=new Peer({debug:1});peer.on("open",function(){connection=peer.connect(peerId(room),{reliable:false,serialization:"json"});connection.on("open",function(){dot.classList.add("connected");connectButton.textContent="已连接";msg("连接成功：正在同步电脑端音色")});connection.on("data",function(data){if(data&&data.type==="instrument")setInstrument(data.mode)});connection.on("close",function(){dot.classList.remove("connected");connectButton.disabled=false;connectButton.textContent="重新连接";clearNotes();msg("连接已断开")});connection.on("error",function(){connectButton.disabled=false;connectButton.textContent="重新连接";msg("连接失败，请确认配对码")})});peer.on("error",function(){connectButton.disabled=false;connectButton.textContent="重新连接";msg("连接失败，请确认电脑端仍在等待")})});
    document.querySelectorAll(".mode").forEach(function(button){button.addEventListener("click",function(){mode=button.dataset.mode;document.querySelectorAll(".mode").forEach(function(item){item.classList.toggle("active",item===button)});clearNotes();send({type:"note",action:"allOff",t:Date.now()})})});
    function noteData(button,action){return{type:"note",action:action,midi:Number(button.dataset.midi),name:button.dataset.name,velocity:velocity(),t:Date.now()}}
    function noteOn(button){if(mode==="latch"&&button.classList.contains("active")){button.classList.remove("active");send(noteData(button,"off"));return}button.classList.add("active");if(send(noteData(button,"on")))msg(button.dataset.name+" · 动作改变正在持续的声音")}
    function noteOff(button){if(mode!=="hold"||!button.classList.contains("active"))return;button.classList.remove("active");send(noteData(button,"off"))}
    function clearNotes(){document.querySelectorAll(".note.active").forEach(function(button){button.classList.remove("active")})}
    document.querySelectorAll(".note").forEach(function(button){button.addEventListener("pointerdown",function(event){event.preventDefault();button.setPointerCapture(event.pointerId);noteOn(button)});button.addEventListener("pointerup",function(event){event.preventDefault();noteOff(button)});button.addEventListener("pointercancel",function(){noteOff(button)})});
    var stringBoard=document.getElementById("string-board"),stringCursor=document.getElementById("string-cursor"),stringPitch=document.getElementById("string-pitch"),stringBases=[55,62,69,76],majorPitchClasses=[0,2,4,5,7,9,11];
    document.querySelectorAll(".string-lane").forEach(function(lane,index){for(var step=0;step<=7;step++){var midi=stringBases[index]+step,mark=document.createElement("b");mark.className="pitch-mark"+(majorPitchClasses.indexOf(midi%12)>=0?" scale":"");mark.style.setProperty("--p",step/7);if(mark.classList.contains("scale")){var label=document.createElement("label");label.textContent=pitchName(midi).replace(/[ +−-].*/,"");mark.appendChild(label)}lane.appendChild(mark)}});
    function stringPoint(event,action){var rect=stringBoard.getBoundingClientRect(),usable=rect.width-94,x=Math.min(1,Math.max(0,(event.clientX-rect.left-44)/usable)),y=Math.min(.999,Math.max(0,(event.clientY-rect.top)/rect.height)),stringIndex=Math.min(3,Math.floor(y*4)),raw=stringBases[stringIndex]+x*7,now=performance.now(),speed=lastStringMove?Math.abs(x-lastStringMove.x)/Math.max(1,now-lastStringMove.t):1,nearest=Math.round(raw),distance=Math.abs(raw-nearest),midi=raw;if(speed<.0018&&distance<.22)midi=raw+(nearest-raw)*(1-distance/.22)*.72;lastStringMove={x:x,t:now};stringCursor.style.setProperty("--x",(44+x*usable)/rect.width*100+"%");stringCursor.style.setProperty("--y",((stringIndex+.5)/4*100)+"%");stringCursor.classList.add("active");stringPitch.textContent=pitchName(midi);send({type:"string",action:action,stringIndex:stringIndex,midi:midi,expression:.7,t:Date.now()})}
    function pitchName(midi){var names=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"],rounded=Math.round(midi),cents=Math.round((midi-rounded)*100),name=names[(rounded%12+12)%12]+(Math.floor(rounded/12)-1);return Math.abs(cents)<3?name:name+(cents>0?" +":" ")+cents+"¢"}
    function endString(notify){if(activeStringPointer===null)return;activeStringPointer=null;lastStringMove=null;stringCursor.classList.remove("active");send({type:"string",action:"end",stringIndex:0,midi:55,expression:0,t:Date.now()});if(notify)msg("离弦 · 自然释音")}
    stringBoard.addEventListener("pointerdown",function(event){if(instrument!=="strings")return;event.preventDefault();activeStringPointer=event.pointerId;stringBoard.setPointerCapture(event.pointerId);stringPoint(event,"start")});
    stringBoard.addEventListener("pointermove",function(event){if(event.pointerId!==activeStringPointer)return;event.preventDefault();stringPoint(event,"move")});
    stringBoard.addEventListener("pointerup",function(event){if(event.pointerId===activeStringPointer)endString(true)});stringBoard.addEventListener("pointercancel",function(){endString(true)});
    document.getElementById("stop").addEventListener("click",function(){clearNotes();endString(false);send({type:"note",action:"allOff",t:Date.now()});msg("全部音符已停止")});
    sensorButton.addEventListener("click",async function(){if(!("DeviceMotionEvent" in window)){msg("当前浏览器不支持运动传感器");return}try{var mp=typeof DeviceMotionEvent.requestPermission==="function"?await DeviceMotionEvent.requestPermission():"granted";var op=typeof DeviceOrientationEvent.requestPermission==="function"?await DeviceOrientationEvent.requestPermission():"granted";if(mp!=="granted"||op!=="granted"){msg("没有获得动作与方向传感器权限");return}window.addEventListener("deviceorientation",function(e){orientation={alpha:e.alpha||0,beta:e.beta||0,gamma:e.gamma||0}});window.addEventListener("devicemotion",function(e){var now=performance.now();if(now-lastSent<28)return;lastSent=now;var a=e.acceleration||e.accelerationIncludingGravity||{},r=e.rotationRate||{},ax=a.x||0,ay=a.y||0,az=a.z||0;energy=Math.sqrt(ax*ax+ay*ay+az*az);var frame={type:"sensor",ax:ax,ay:ay,az:az,alpha:orientation.alpha,beta:orientation.beta,gamma:orientation.gamma,rx:r.alpha||0,ry:r.beta||0,rz:r.gamma||0,magnitude:energy,t:Date.now()};magnitude.textContent=energy.toFixed(1);document.getElementById("x").textContent=ax.toFixed(1);document.getElementById("y").textContent=ay.toFixed(1);document.getElementById("z").textContent=az.toFixed(1);document.getElementById("tilt").textContent=orientation.gamma.toFixed(0)+"°";send(frame)});motion.classList.add("active");sensorButton.disabled=true;sensorButton.textContent="动作已启用";msg(instrument==="strings"?"晃动强度正在控制揉弦深度与速度（CC1）":instrument==="shaker"?"轻微波动持续时沙锤连续演奏，停止动作后迅速停止":instrument==="drum"?"做一次明确冲击或急停来触发重鼓":"触键定音；倾斜、摇动与快速升降塑造音色")}catch(error){msg("无法启用传感器，请检查 Safari 权限")}});
  })();
  </script>
</body>
</html>
